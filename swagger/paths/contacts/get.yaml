summary: Get list of contacts
operationId: getContacts
tags:
  - Contacts
description: Retrieve a paginated list of contacts with optional filters.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
    example: 1
    description: Page number for pagination.
  - in: query
    name: perPage
    schema:
      type: integer
    example: 10
    description: Number of contacts per page.
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'age'
    description: "All contact's fields can be mentioned. Default value - _id"
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
responses:
  '200':
    description: Successfully retrieved contacts list.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contacts fetched successfully.
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '404':
    $ref: '../../components/responses/notFound.yaml'
