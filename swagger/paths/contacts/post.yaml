tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact record.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phoneNumber
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            format: email
            example: johndoe@gmail.com
          phoneNumber:
            type: string
            example: '+380123456789'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: home
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Contact created successfully.
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully.
            data:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: johndoe@gmail.com
                phoneNumber:
                  type: string
                  example: '+380123456789'
                contactType:
                  type: string
                  example: personal
                isFavourite:
                  type: boolean
                  example: false
  '400':
    $ref: '../../components/responses/notFound.yaml'
