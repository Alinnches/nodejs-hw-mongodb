tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact record.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phone:
            type: string
          photo:
            type: string
            format: binary
        required:
          - name
          - email
responses:
  '201':
    description: Contact created successfully.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: '../../components/responses/notFound.yaml'
