tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: Update fields of an existing contact.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: The ID of the contact to update.
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phone:
            type: string
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully.
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/notFound.yaml'
