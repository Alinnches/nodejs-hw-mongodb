tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: Update fields of an existing contact.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    description: The ID of the contact to update.
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John
          email:
            type: string
            format: email
            example: john@gmai.com
          phoneNumber:
            type: string
            example: '+380123456789'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: home
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully.
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully.
            data:
              type: object
              properties:
                name:
                  type: string
                  example: John
                email:
                  type: string
                  example: john@gmail.com
                phoneNumber:
                  type: string
                  example: '+380123456789'
                contactType:
                  type: string
                  example: home
                isFavourite:
                  type: boolean
                  example: false
  '404':
    $ref: '../../../components/responses/notFound.yaml'
